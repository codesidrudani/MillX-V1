<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading MillX...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; color: #334155; margin: 0; }
    .loader { border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { font-size: 18px; font-weight: 500; margin-bottom: 20px; max-width: 80%; text-align: center; }
    #logs { font-family: "Courier New", Courier, monospace; font-size: 13px; background: #1e293b; color: #10b981; padding: 15px; border-radius: 8px; width: 80%; max-width: 800px; height: 300px; overflow-y: auto; text-align: left; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body>
  <div class="loader" id="spinner"></div>
  <div id="status">Starting Desktop Environment...</div>
  <div id="logs"></div>
</body>
</html>
